# social_nav の Nav2 パラメータ(設計書 3.1-3.5, 10.4)。
# ロボット固有の値(駆動方式・形状・速度上限)はこのファイルと launch 引数にだけ置く。
# 形状・駆動方式は launch 引数(drive_type, footprint_type, robot_radius, footprint)で上書きされる。
# ここに書いてある robot_radius / footprint_type などは MVP 既定値(diff_drive / circle / 0.3)。
# ふるまいの閾値(social_behavior.*)は bt_navigator の下だけに置く。BT XML には書かない。

people_tracker_node:
  ros__parameters:
    base_frame: base_link
    odom_frame: odom
    map_frame: map
    cloud_topic: points
    map_topic: map
    output_topic: /social_nav/tracked_people
    publish_rate: 10.0

lifecycle_manager_navigation:
  ros__parameters:
    autostart: true
    bond_timeout: 10.0
    node_names:
      - map_server
      - controller_server
      - planner_server
      - behavior_server
      - bt_navigator
      - velocity_smoother
      - collision_monitor

map_server:
  ros__parameters:
    yaml_filename: ""   # launch の map 引数で上書き

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    default_nav_to_pose_bt_xml: ""   # launch の bt_xml 引数で上書き
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
    # Jazzy では標準の BT ノードは既定で読まれるため、追加分(自作ノード)だけを書く(重複登録でクラッシュする)
    # Jazzy 専用。Humble/Iron では標準 BT ノードのライブラリ名の列挙が必要。
    plugin_lib_names:
      - social_nav_bt_nodes
    # TacticalSelector のパラメータ(コアの TacticalParams。既定値はコアの既定値と同じ)
    social_behavior:
      stale_timeout: 0.5
      min_confidence: 0.3
      speed_limit_topic: /speed_limit
      v_max: 0.8
      corridor_lookahead: 2.5
      corridor_half_width: 0.5
      density_radius: 3.0
      density_low: 0.1
      density_high: 0.5
      min_ratio: 0.4
      blocker_max_speed: 0.3
      max_yield_time: 5.0
      yield_cooldown: 10.0
      follow_min_speed: 0.5
      follow_heading_tol: 0.8
      follow_gap: 1.5
      density_wait: 0.8
      density_resume: 0.6
      max_wait_time: 15.0
      min_dwell: 1.0

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    speed_limit_topic: /speed_limit
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    # BT の controller_id="FollowPath"(既定、MPPI + SocialCritic)。比較用の SocialDWA は launch の controller:=social
    controller_plugins: ["FollowPath", "SocialDWA"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1500
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.8
      vx_min: -0.35
      vy_max: 0.5
      wz_max: 1.9
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      regenerate_noises: true
      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic", "SocialCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        near_collision_cost: 253
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # 社会的コスト(初期 cost_weight 5.0 は要チューニング。Gazebo 等での調整は未実施)
      SocialCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        people_topic: /social_nav/tracked_people
        sigma: 0.45
        velocity_gain: 0.4
        rear_ratio: 0.6
        collision_margin: 0.1
        collision_cost: 1000.0
        time_decay_tau: 2.0
        step_subsample: 2
        max_range: 6.0
        stale_timeout: 0.5
        min_confidence: 0.3
        footprint_type: circle      # launch 引数で上書き
        robot_radius: 0.3           # launch 引数で上書き
        footprint: "[]"             # launch 引数で上書き
    SocialDWA:
      plugin: "social_nav_controller::SocialController"
      motion_model: diff_drive      # launch 引数 drive_type で上書き
      footprint_type: circle        # launch 引数で上書き
      robot_radius: 0.3             # launch 引数で上書き
      footprint: "[]"               # launch 引数で上書き
      people_topic: /social_nav/tracked_people
      stale_timeout: 0.5
      min_confidence: 0.3
      path_lookahead: 3.0
      stuck_timeout: 2.0
      v_max: 0.8
      w_max: 1.9
      # accel_rollout(既定 false、実機では有効にしない): true にするなら accel_clear_time > 0 が必要
      # (0 以下だと警告して false に戻す)。people_valid かつ人なしが accel_clear_time 秒続いた後だけ加速軌道を評価する。
      # 前提の 1 つを満たしただけで、開口部で人と出会う課題は残る。timer は 1 呼び出し = dt なので
      # controller_frequency = 1/dt のときだけ秒数が合う(合わなければ警告)
      accel_clear_time: 0.0
      # door_yield(既定 false、実機では有効にしない): true なら map(door_map_topic)を購読し、地図の距離場から sim と同じ式で
      # 静的障害物コストを作って狭所点の判定に使う(地図未受信・TF 失敗の間は狭所点なし = 発動しない)。
      # 前提が残る: 地図に載らない開口部は検出できない、自己位置の誤差が直接効く、sim の証拠は accel_rollout と両方 on の組だけ
      # (accel_rollout off なら起動時に警告)。door_* の閾値は core の既定のまま。タイマの秒数は accel_rollout と同じ規則(警告あり)
      door_yield: false
      # door_map_topic: map
      # door_occupied_thresh: 65

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.3             # launch 引数で上書き
      plugins: ["voxel_layer", "inflation_layer", "social_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: lidar rgbd
        lidar:
          topic: /points
          data_type: "PointCloud2"
          min_obstacle_height: 0.1
          max_obstacle_height: 1.8
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        rgbd:
          topic: /rgbd/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.1
          max_obstacle_height: 1.8
          clearing: true
          marking: true
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      # local では無効(定義だけ置く。global のみ有効、3.1)
      social_layer:
        plugin: "social_nav_costmap_plugins::SocialLayer"
        enabled: false
        people_topic: /social_nav/tracked_people
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.3             # launch 引数で上書き
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "voxel_layer", "inflation_layer", "social_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: lidar rgbd
        lidar:
          topic: /points
          data_type: "PointCloud2"
          min_obstacle_height: 0.1
          max_obstacle_height: 1.8
          clearing: true
          marking: true
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
        rgbd:
          topic: /rgbd/points
          data_type: "PointCloud2"
          min_obstacle_height: 0.1
          max_obstacle_height: 1.8
          clearing: true
          marking: true
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      social_layer:
        plugin: "social_nav_costmap_plugins::SocialLayer"
        enabled: true
        people_topic: /social_nav/tracked_people
        max_cost: 200
        sigma: 0.45
        velocity_gain: 0.4
        rear_ratio: 0.6
        cutoff_cost: 0.05
        max_speed_for_layer: 0.3
        prediction_time: 0.0
        stale_timeout: 0.5
        min_confidence: 0.3
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smooth_path: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# controller -(cmd_vel_nav)-> velocity_smoother -(cmd_vel_smoothed)-> collision_monitor -(cmd_vel)-> ロボット
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.8, 0.0, 1.9]
    min_velocity: [-0.35, 0.0, -1.9]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# 安全停止。追跡・costmap・BT のいずれにも依存しない(3.5)
collision_monitor:
  ros__parameters:
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["PolygonStop", "PolygonSlow"]
    # PolygonStop / PolygonSlow の radius は launch が robot_radius + 0.15 / + 0.5 で上書きする(ここは既定 0.3 の値)。
    PolygonStop:
      type: "circle"
      radius: 0.45
      action_type: "stop"
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_stop"
      enabled: true
    PolygonSlow:
      type: "circle"
      radius: 0.8
      action_type: "slowdown"
      slowdown_ratio: 0.4
      min_points: 4
      visualize: true
      polygon_pub_topic: "polygon_slow"
      enabled: true
    observation_sources: ["pointcloud"]
    pointcloud:
      type: "pointcloud"
      topic: "points"
      min_height: 0.1
      max_height: 1.5
      enabled: true
