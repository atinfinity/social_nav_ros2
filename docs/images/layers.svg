<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" font-family="'Noto Sans JP','Hiragino Sans',sans-serif" viewBox="0 0 760 520" role="img" aria-label="判断は上の層ほど遅く、安全停止は他の層に依存しない" font-size="13"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8f98"></path></marker></defs><text x="24" y="28" font-size="15" font-weight="600" fill="#1f2328">判断は上の層ほど遅く、安全停止は他の層に依存しない</text><g font-size="11.5" fill="#59636e"><text x="24" y="64">層 / 周期</text><text x="148" y="64">Nav2 上の置き場所</text><text x="360" y="64">ROS 側の部品</text><text x="566" y="64">コア（ROS 非依存）</text></g><g fill="none" stroke="#8a8f98" stroke-width="1.25"><path d="M168 130V170" marker-end="url(#arr)"></path><path d="M168 222V262" marker-end="url(#arr)"></path><path d="M168 314V354" marker-end="url(#arr)"></path><path d="M168 406V446" marker-end="url(#arr)"></path><path d="M344 104H360"></path><path d="M344 196H360"></path><path d="M344 288H360"></path><path d="M344 380H360"></path><path d="M344 472H360"></path><path d="M550 104H566" stroke-dasharray="4 3"></path><path d="M550 196H566" stroke-dasharray="4 3"></path><path d="M550 288H566" stroke-dasharray="4 3"></path><path d="M550 380H566" stroke-dasharray="4 3"></path></g><g font-size="11.5" fill="#59636e"><text x="180" y="154">/tracked_people → 戦略・戦術・反応の各層へ</text><text x="180" y="246">経路 path</text><text x="180" y="338">FollowPath の実行 / 停止 と /speed_limit</text><text x="180" y="430">cmd_vel（velocity_smoother 経由）</text></g><g><text x="24" y="101" font-weight="600" fill="#1f2328">知覚</text><text x="24" y="118" font-size="11.5" fill="#59636e">10 Hz</text><text x="24" y="193" font-weight="600" fill="#1f2328">戦略</text><text x="24" y="210" font-size="11.5" fill="#59636e">1 Hz</text><text x="24" y="285" font-weight="600" fill="#1f2328">戦術</text><text x="24" y="302" font-size="11.5" fill="#59636e">約 10 Hz</text><text x="24" y="377" font-weight="600" fill="#1f2328">反応</text><text x="24" y="394" font-size="11.5" fill="#59636e">20 Hz</text><text x="24" y="469" font-weight="600" fill="#1f2328">安全</text><text x="24" y="486" font-size="11.5" fill="#59636e">センサ周期</text></g><g><rect x="148" y="78" width="196" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="160" y="101" fill="#1f2328">別ノード</text><text x="160" y="118" font-size="11.5" fill="#59636e">3D LiDAR 点群を購読</text><rect x="360" y="78" width="190" height="52" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"></rect><text x="372" y="101" font-weight="600" fill="#1f2328">people_tracker_node</text><text x="372" y="118" font-size="11.5" fill="#1f2328">新規ラッパ</text><rect x="566" y="78" width="170" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="578" y="101" font-size="12" fill="#1f2328">LidarClusterDetector</text><text x="578" y="118" font-size="12" fill="#1f2328">PeopleTracker</text></g><g><rect x="148" y="170" width="196" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="160" y="193" fill="#1f2328">planner_server</text><text x="160" y="210" font-size="11.5" fill="#59636e">+ global costmap</text><rect x="360" y="170" width="190" height="52" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"></rect><text x="372" y="193" font-weight="600" fill="#1f2328">SocialLayer</text><text x="372" y="210" font-size="11.5" fill="#1f2328">SmacPlanner2D は流用</text><rect x="566" y="170" width="170" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="578" y="193" font-size="12" fill="#1f2328">rasterizeSocialCost</text><text x="578" y="210" font-size="11.5" fill="#59636e">静止・低速の人だけ</text></g><g><rect x="148" y="262" width="196" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="160" y="285" fill="#1f2328">bt_navigator</text><text x="160" y="302" font-size="11.5" fill="#59636e">BT ノードからコアを呼ぶ</text><rect x="360" y="262" width="190" height="52" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"></rect><text x="372" y="285" font-weight="600" fill="#1f2328">SelectSocialBehavior</text><text x="372" y="302" font-size="11.5" fill="#1f2328">HoldPosition</text><rect x="566" y="262" width="170" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="578" y="285" font-size="12" font-weight="600" fill="#1f2328">TacticalSelector</text><text x="578" y="302" font-size="11.5" fill="#59636e">進む/追従/譲る/待つ</text></g><g><rect x="148" y="354" width="196" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="160" y="377" fill="#1f2328">controller_server</text><text x="160" y="394" font-size="11.5" fill="#59636e">MPPI を流用</text><rect x="360" y="354" width="190" height="52" rx="8" fill="#2f6fde" fill-opacity="0.12" stroke="#2f6fde" stroke-width="2"></rect><text x="372" y="377" font-weight="600" fill="#1f2328">SocialCritic</text><text x="372" y="394" font-size="11.5" fill="#1f2328">比較用 SocialController</text><rect x="566" y="354" width="170" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25" stroke-dasharray="5 4"></rect><text x="578" y="377" font-size="12" fill="#1f2328">SocialTrajectoryCost</text><text x="578" y="394" font-size="12" fill="#1f2328">SamplingController</text></g><g><rect x="148" y="446" width="196" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="160" y="469" fill="#1f2328">collision_monitor</text><text x="160" y="486" font-size="11.5" fill="#59636e">velocity_smoother の後段</text><rect x="360" y="446" width="190" height="52" rx="8" fill="none" fill-opacity="1" stroke="#8a8f98" stroke-width="1.25"></rect><text x="372" y="469" fill="#1f2328">流用</text><text x="372" y="486" font-size="11.5" fill="#59636e">params のみ</text><text x="566" y="469" font-size="11.5" fill="#59636e">追跡にもコアにも</text><text x="566" y="486" font-size="11.5" fill="#59636e">依存しない</text></g></svg>